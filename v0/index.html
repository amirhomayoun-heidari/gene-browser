<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gene Browser v0</title>
</head>
<body>
  <h2>Gene Browser v0</h2>

  <div>
    <select id="chromSelect"></select>
    <button id="zoomIn">Zoom in</button>
    <button id="zoomOut">Zoom out</button>
    <button id="left">&larr;</button>
    <button id="right">&rarr;</button>
    <span id="region"></span>
  </div>

  <svg id="track" width="1000" height="120" style="border: 1px solid #ccc"></svg>
  <div id="info">Hover over a gene</div>
  <script src="browser.js"></script>
</body>
</html>
